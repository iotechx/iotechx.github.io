<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading Manuscript...</title>
    <style>
        :root {
            --bg-color: #e5e5e5;
            --page-bg: #ffffff;
            --border-color: #111111;
            --text-primary: #000000;
            --text-secondary: #333333;
            --font-serif: "Times New Roman", Times, Georgia, serif;
            --font-sans: Arial, Helvetica, sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        body.apavada-active {
            --bg-color: #111111;
            --page-bg: #1a1a1a;
            --border-color: #555555;
            --text-primary: #f0f0f0;
            --text-secondary: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-serif);
            line-height: 1.35; /* Tightened academic line-height */
            font-size: 10.5pt;  /* Standard A4 typography scale */
            padding: 1.5rem 0;
            transition: background-color 0.2s ease;
        }

        /* Strict A4 Paper Proportion Container (210mm scaled to desktop) */
        .a4-container {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: var(--page-bg);
            padding: 20mm 18mm; /* Standard 20mm A4 print margins */
            border: 1px solid var(--border-color);
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        /* Standard Academic Journal Header */
        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .journal-meta {
            font-family: var(--font-sans);
            font-size: 8.5pt;
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 16pt;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .author-line {
            font-family: var(--font-sans);
            font-size: 9.5pt;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .affiliation-line {
            font-family: var(--font-sans);
            font-size: 8.5pt;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Compact Abstract Box */
        .abstract-box {
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 9.5pt;
            line-height: 1.3;
            background: rgba(0,0,0,0.01);
        }

        .abstract-box h2 {
            font-family: var(--font-sans);
            font-size: 8.5pt;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .keywords {
            margin-top: 0.5rem;
            padding-top: 0.4rem;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-sans);
            font-size: 8.5pt;
        }

        /* Dense Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            margin-bottom: 1.25rem;
            font-family: var(--font-sans);
            font-size: 8.5pt;
            background: rgba(0,0,0,0.02);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 16px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #888; transition: .2s; border-radius: 16px;
        }

        .slider:before {
            position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px;
            background-color: white; transition: .2s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--text-primary); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Compact Triad Grid */
        .triad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .triad-card {
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.75rem;
            font-size: 9pt;
            line-height: 1.25;
            cursor: pointer;
        }

        .triad-card h3 {
            font-family: var(--font-sans);
            font-size: 9pt;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }

        .triad-card .sub {
            font-family: var(--font-sans);
            font-size: 7.5pt;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            display: block;
        }

        /* Compact Concordance Table */
        .concordance-section {
            margin-bottom: 1.25rem;
        }

        .concordance-section h2 {
            font-family: var(--font-sans);
            font-size: 9pt;
            font-weight: bold;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        table.concordance-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5pt;
            line-height: 1.25;
            border-top: 1.5px solid var(--border-color);
            border-bottom: 1.5px solid var(--border-color);
        }

        table.concordance-table th, 
        table.concordance-table td {
            padding: 0.35rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        table.concordance-table th {
            font-family: var(--font-sans);
            font-weight: bold;
            background: rgba(0,0,0,0.03);
        }

        /* Dense Two-Column Academic Layout */
        .chapter-list {
            column-count: 2;
            column-gap: 1.25rem;
            text-align: justify;
        }

        article.chapter {
            break-inside: avoid;
            margin-bottom: 1rem;
        }

        article.chapter h2 {
            font-family: var(--font-sans);
            font-size: 9.5pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.15rem;
        }

        article.chapter p {
            text-indent: 1.2em;
            margin-bottom: 0.4rem;
            font-size: 9.5pt;
            line-height: 1.35;
        }

        body.apavada-active .scaffold-hide {
            opacity: 0.2;
            filter: blur(0.4px);
        }

        footer {
            margin-top: 2rem;
            border-top: 1.5px solid var(--border-color);
            padding-top: 0.5rem;
            font-family: var(--font-sans);
            font-size: 7.5pt;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        @media print {
            body { background: white; padding: 0; }
            .a4-container { border: none; box-shadow: none; width: 100%; padding: 0; }
            .toolbar { display: none; }
        }
    </style>
</head>
<body>

    <div class="a4-container">
        <header>
            <div class="journal-meta">
                <span id="journal-name">Academic Monograph</span>
                <span id="article-type">Open Access</span>
            </div>
            <h1 id="meta-title">Loading Title...</h1>
            <div class="author-line" id="meta-author">Author Name</div>
            <div class="affiliation-line" id="meta-affiliation">Affiliation</div>
        </header>

        <div class="abstract-box">
            <h2>Abstract</h2>
            <p id="meta-abstract">Loading Abstract...</p>
            <div class="keywords">
                <strong>Keywords: </strong><span id="meta-keywords">Loading Keywords...</span>
            </div>
        </div>

        <div class="toolbar">
            <span id="toolbar-system-tag">System Tag</span>
            <div class="toggle-group">
                <span id="toolbar-label-left">Aadhyāropa</span>
                <label class="switch">
                    <input type="checkbox" id="apavada-toggle">
                    <span class="slider"></span>
                </label>
                <span id="toolbar-label-right">Apavāda</span>
            </div>
        </div>

        <div class="triad-grid" id="triad-container"></div>
        <section class="concordance-section" id="concordance-container"></section>
        <div class="chapter-list" id="chapter-container"></div>

        <footer id="footer-section">
            <span id="footer-copyright">Copyright</span>
            <span id="footer-license">License</span>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const jsonPath = 'thesis-data.json';

            try {
                const response = await fetch(jsonPath);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();

                document.getElementById('page-title').textContent = data.metadata.title;
                document.getElementById('journal-name').textContent = data.metadata.journal || "Academic Monograph";
                document.getElementById('article-type').textContent = data.metadata.articleType || "Research Article";
                document.getElementById('meta-title').textContent = data.metadata.title;
                document.getElementById('meta-author').textContent = data.metadata.author;
                document.getElementById('meta-affiliation').textContent = data.metadata.affiliation || "";
                document.getElementById('meta-abstract').textContent = data.metadata.abstract || "";
                document.getElementById('meta-keywords').textContent = (data.metadata.keywords || []).join(" • ");

                document.getElementById('toolbar-system-tag').textContent = data.toolbar.systemTag;
                document.getElementById('toolbar-label-left').textContent = data.toolbar.aadhyaropaLabel;
                document.getElementById('toolbar-label-right').textContent = data.toolbar.apavadaLabel;
                document.getElementById('footer-copyright').textContent = `© ${data.footer.year} ${data.footer.author}`;
                document.getElementById('footer-license').textContent = data.footer.license;

                const triadContainer = document.getElementById('triad-container');
                triadContainer.innerHTML = '';
                data.triadNodes.forEach(node => {
                    const card = document.createElement('div');
                    card.className = 'triad-card';
                    card.innerHTML = `
                        <h3>${node.name}</h3>
                        <span class="sub">${node.principle} | ${node.vedanta}</span>
                        <p>${node.desc}</p>
                    `;
                    triadContainer.appendChild(card);
                });

                const concordanceContainer = document.getElementById('concordance-container');
                if (data.concordanceTable) {
                    const tableData = data.concordanceTable;
                    concordanceContainer.innerHTML = `
                        <h2>${tableData.title}</h2>
                        <table class="concordance-table">
                            <thead>
                                <tr>${tableData.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                            </thead>
                            <tbody>
                                ${tableData.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}
                            </tbody>
                        </table>
                    `;
                }

                const chapterContainer = document.getElementById('chapter-container');
                chapterContainer.innerHTML = '';
                data.chapters.forEach((chap, idx) => {
                    const article = document.createElement('article');
                    article.className = `chapter ${idx > 3 ? 'scaffold-hide' : ''}`;
                    article.innerHTML = `
                        <h2>${chap.number}. ${chap.title}</h2>
                        <p>${chap.content.replace(/\n\n/g, '</p><p>')}</p>
                    `;
                    chapterContainer.appendChild(article);
                });

            } catch (error) {
                console.error("Failed to load thesis JSON data:", error);
            }

            document.getElementById('apavada-toggle').addEventListener('change', (e) => {
                if (e.target.checked) {
                    document.body.classList.add('apavada-active');
                } else {
                    document.body.classList.remove('apavada-active');
                }
            });
        });
    </script>
</body>
</html>
