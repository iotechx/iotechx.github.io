<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="theme-color" content="#e8e9df">
 <meta name="description"
  content="A journal of independent research in consciousness, metaphysics, theology, and technology.">
 <title>IOTechX | Journal of Consciousness &amp; Metaphysics</title>
 <link rel="stylesheet" href="styles.css">
</head>

<body>
 <div class="reader-shell">
  <header class="reader-topbar">
   <div class="topbar-brand">
    <button class="mobile-drawer-toggle" id="mobile-drawer-toggle" type="button" aria-label="Open article navigation"
     aria-controls="issue-rail" aria-expanded="false" hidden>
     <span></span><span></span><span></span>
    </button>
    <a class="wordmark" href="#contents" id="home-link" aria-label="IOTechX journal contents">
     <span>IOTECHX <small>JOURNAL OF CONSCIOUSNESS &amp; METAPHYSICS</small></span>
    </a>
   </div>
  </header>

  <div class="reader-workspace">
   <aside class="issue-rail" id="issue-rail" aria-label="Articles in this issue" hidden>
    <div class="rail-heading">
     <span class="eyebrow">Issue 01 / 2026</span>
     <h2>In this issue</h2>
    </div>
    <nav id="issue-nav" class="issue-nav" aria-label="Choose an article"></nav>
    <p class="rail-note">Two long-form studies<br>Open access / 2026</p>
   </aside>

   <div class="page-stage">
    <div class="page-controls" aria-label="Article navigation">
     <button id="previous-button" class="page-control" type="button" aria-label="Previous article">←
      <span>Previous</span></button>
     <span id="page-status" class="page-status" aria-live="polite">Contents</span>
     <button id="next-button" class="page-control" type="button" aria-label="Next article"><span>Next</span> →</button>
    </div>
    <main id="reader-page" class="paper" aria-live="polite" aria-busy="false" tabindex="-1">
     <p class="loading-message">Opening the issue…</p>
    </main>
   </div>
  </div>
 </div>
 <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="Close article navigation"
  hidden></button>
 <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top"
  hidden>⬆️</button>
 <script src="script.js"></script>
</body>

</html>
